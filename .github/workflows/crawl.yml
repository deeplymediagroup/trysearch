# The nightly crawl (07-CRAWLER-AND-JOBS.md §6).
#
# Runs on GitHub Actions rather than Vercel: Vercel's function duration caps are a poor fit
# for a multi-hour crawl, while a single Actions runner is ONE IP, which keeps the politeness
# budget in one predictable place.
#
# ── Actions minutes ────────────────────────────────────────────────────────────
# MEASURED cost after batching the crawler's database writes: ~3.6s per keyword plus ~1.7
# min of fixed overhead. That is ~150 min/month at 40 keywords and ~1,890 at 1,000 — inside
# the ~2,000-minute free tier for a private repo.
#
# Two things keep it there:
#   1. `--max-minutes` below is a HARD ceiling. The crawl stops cleanly when it expires and
#      resumes tomorrow, oldest keywords first. It can never produce a surprise bill.
#   2. If this repo is PUBLIC, GitHub gives unlimited standard-runner minutes and the whole
#      question disappears.
# The unlimited fallback either way is `npm run crawl` on Brandon's own machine, which is why
# scripts/crawl.mjs is a standalone .mjs with no build step.
name: nightly-crawl

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC — off-peak for the stores, and fresh by morning
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated job list (blank = all)'
        required: false
        default: ''
      max_minutes:
        description: 'Hard wall-clock budget in minutes'
        required: false
        default: '45'

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Belt and braces: --max-minutes stops the crawl gracefully; this kills a hung run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Crawl
        run: |
          node scripts/crawl.mjs \
            ${{ github.event.inputs.jobs && format('--jobs {0}', github.event.inputs.jobs) || '--all' }} \
            --max-minutes ${{ github.event.inputs.max_minutes || '45' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Optional. Absent secrets degrade one feature and populate `warnings`; they never
          # fail the run.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          # App Manager key — only this role can read the hidden keywords field.
          ASC_MANAGER_KEY_ID: ${{ secrets.ASC_MANAGER_KEY_ID }}
          ASC_MANAGER_PRIVATE_KEY: ${{ secrets.ASC_MANAGER_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Play Console real search terms: inline service-account JSON + the bucket name
          # copied from Play Console -> Download reports -> "Copy Cloud Storage URI".
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_GCS_BUCKET: ${{ secrets.PLAY_GCS_BUCKET }}

      - name: Trends
        if: always()
        run: node scripts/trends-job.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}


